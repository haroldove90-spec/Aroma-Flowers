<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="glassRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Greenhouse Arch Structure -->
  <path d="M 30,150 L 30,95 Q 30,30 100,22 Q 170,30 170,95 L 170,150" 
        fill="none" stroke="url(#glassRoof)" stroke-width="6" stroke-linecap="round" />
  
  <!-- Greenhouse Gable Vault / Roof Ribs -->
  <path d="M 60,150 L 60,80 Q 60,40 100,32 Q 140,40 140,80 L 140,150" 
        fill="none" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="4 2" />
  <line x1="100" y1="22" x2="100" y2="150" stroke="#059669" stroke-width="2" stroke-opacity="0.4" />
  <line x1="30" y1="95" x2="170" y2="95" stroke="#059669" stroke-width="2" stroke-opacity="0.3" />

  <!-- Botanical Base Soil / Ground -->
  <path d="M 20,155 Q 100,165 180,155" fill="none" stroke="#065f46" stroke-width="5" stroke-linecap="round" />

  <!-- Blooming Petals (Aroma Floral Center) -->
  <!-- Left Leaf -->
  <path d="M 100,140 C 70,135 55,105 72,82 C 85,98 96,118 100,140 Z" 
        fill="url(#emeraldGrad)" opacity="0.95" />
  <!-- Right Leaf -->
  <path d="M 100,140 C 130,135 145,105 128,82 C 115,98 104,118 100,140 Z" 
        fill="url(#emeraldGrad)" opacity="0.95" />
  
  <!-- Center Petals Rose / Floral Core -->
  <path d="M 100,128 C 80,105 82,75 100,56 C 118,75 120,105 100,128 Z" 
        fill="url(#roseGrad)" />
  <path d="M 100,118 C 88,100 90,80 100,68 C 110,80 112,100 100,118 Z" 
        fill="#ffffff" opacity="0.8" />
  
  <!-- Central Stem & Aroma Essence Sparkles -->
  <path d="M 100,150 L 100,120" stroke="#047857" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="52" r="3.5" fill="#f43f5e" />
  <circle cx="84" cy="46" r="2.5" fill="#10b981" />
  <circle cx="116" cy="46" r="2.5" fill="#10b981" />

  <!-- Aroma Waves / Fragrance Lines -->
  <path d="M 88,34 Q 94,26 90,18" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.75" />
  <path d="M 100,28 Q 104,20 100,12" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <path d="M 112,34 Q 106,26 110,18" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" opacity="0.75" />
</svg>
